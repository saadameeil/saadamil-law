<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>تسجيل الدخول للإدارة | سعد أميل</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1120;color:#edf2f7;font:17px/1.7 system-ui,sans-serif;padding:24px}
    main{width:min(100%,420px);padding:32px;background:#151e30;border:1px solid #344157;border-radius:18px}h1{font-size:25px;margin:0 0 12px;color:#e6c878}p{color:#c3cbd8}label{display:block;margin-bottom:8px}input,button{width:100%;font:inherit;padding:12px;border-radius:9px}input{background:#0b1120;color:#fff;border:1px solid #6b7b94}button{margin-top:18px;background:#dfc16c;color:#111827;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:#e6c878}#message{min-height:29px;color:#ffc3c3}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #8bc4ff;outline-offset:3px}
  </style>
  <script src="admin-login-20261118.js" defer></script>

<body><main>
  <h1>تسجيل الدخول للإدارة</h1>
  <p>هذه الصفحة مخصصة لصاحب الموقع.</p>
  <form id="login-form">
    <label for="password">كلمة المرور</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="72">
    <button id="login-button" type="submit" disabled>دخول</button>
    <p id="message" role="status" aria-live="polite">جارٍ تجهيز تسجيل الدخول…</p>
