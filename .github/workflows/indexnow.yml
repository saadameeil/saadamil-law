name: 'Notify IndexNow of published pages'

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Preserve the existing schedule. Acceptance is not proof of indexing.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-published-site
  cancel-in-progress: false

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out submission script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate live pages and notify IndexNow
        run: python3 .github/scripts/indexnow.py --submit
