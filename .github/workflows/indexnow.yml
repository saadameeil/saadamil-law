name: Notify published sitemap pages through IndexNow
on:
  push:
    branches: [master, main]
    paths:
      - "*.html"
      - "articles/*.html"
      - "sitemap.xml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indexnow:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip indexnow]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Notify changed public pages after checking the live sitemap
        run: python3 .github/scripts/indexnow.py
