<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>محرر العرائض القضائية التنفيذي | المحامي سعد فراس أميل</title>
  
  <!-- Strict Privacy: Never Index by Search Engines -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow">

  <!-- Apple iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="العرائض القضائية">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="theme-color" content="#0b1120">

  <!-- High-End Calligraphy Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b1120;
      --surface-dark: #0f172a;
      --card-dark: #1e293b;
      --border-dark: #334155;
      --gold-primary: #d4af37;
      --gold-hover: #b8860b;
      --judicial-red: #dc2626;
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
      --paper-bg: #ffffff;
      --paper-text: #0f172a;
      --font-heading: 'Cairo', 'Amiri', -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
      --font-body: 'Amiri', 'Traditional Arabic', 'Segoe UI', Tahoma, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: var(--font-heading);
      direction: rtl;
      text-align: right;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ================= Header ================= */
    .app-header {
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 10px 16px;
    }

    .header-content {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: 1px solid var(--gold-primary);
      box-shadow: 0 2px 8px rgba(212, 175, 55, 0.3);
    }

    .brand-text h1 {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-text .badge-pill {
      background: linear-gradient(135deg, #d4af37, #996515);
      color: #0b1120;
      font-size: 10.5px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .brand-text p {
      font-size: 11.5px;
      color: var(--gold-primary);
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 13px;
      font-size: 12.5px;
      font-weight: 700;
      font-family: inherit;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-gold {
      background: linear-gradient(135deg, #d4af37, #b8860b);
      color: #0b1120;
      border-color: #fcd34d;
      box-shadow: 0 2px 6px rgba(212, 175, 55, 0.3);
    }

    .btn-gold:hover {
      background: linear-gradient(135deg, #fcd34d, #d4af37);
      transform: translateY(-1px);
    }

    .btn-dark {
      background: #1e293b;
      color: #e2e8f0;
      border-color: #334155;
    }

    .btn-dark:hover {
      background: #334155;
      color: #ffffff;
    }

    /* ================= Main Studio Stage ================= */
    .studio-wrapper {
      max-width: 1060px;
      margin: 0 auto;
      padding: 12px 10px 85px;
    }

    /* Quick Cases Bar */
    .cases-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 10px;
      -webkit-overflow-scrolling: touch;
    }

    .case-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .case-pill.active, .case-pill:hover {
      background: rgba(212, 175, 55, 0.15);
      border-color: var(--gold-primary);
      color: #fde68a;
    }

    /* Document Studio Card */
    .studio-card {
      background: #090e1a;
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    }

    /* ================= Sticky Studio Toolbar ================= */
    .studio-toolbar {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toolbar-row-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Dual Mode Switcher */
    .mode-switch-pill {
      display: flex;
      background: #090e1a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 2px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mode-btn.active {
      background: linear-gradient(135deg, #d4af37, #b8860b);
      color: #0b1120;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    /* Quick Highlight & Formatting Tools */
    .tools-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tool-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.12s;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .tool-btn:hover {
      background: #334155;
      border-color: #94a3b8;
    }

    .btn-red-tool {
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .btn-red-tool:hover {
      background: rgba(239, 68, 68, 0.18);
      border-color: #ef4444;
    }

    .btn-save-tool {
      background: #059669;
      color: #ffffff;
      border-color: #10b981;
    }

    .btn-print-tool {
      background: #2563eb;
      color: #ffffff;
      border-color: #3b82f6;
    }

    /* ================= Document Paper Stage ================= */
    .paper-stage {
      width: 100%;
      min-height: 80vh;
      background: #090e1a;
      padding: 24px 12px 80px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .paper-scaler {
      position: relative;
      flex-shrink: 0;
      margin: 0 auto;
      width: 100%;
      max-width: 820px;
    }

    /* Paper: Mode 1 - Mobile Flow Writing Mode (Clean & Uncrowded) */
    .legal-paper {
      position: relative;
      width: 100%;
      min-height: 900px;
      background: #ffffff;
      color: var(--paper-text);
      border-radius: 8px;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0,0,0,0.12);
      box-sizing: border-box;
      padding: 32px 28px;
      margin: 0 auto;
      transition: transform 0.2s ease, width 0.2s ease, padding 0.2s ease;
    }

    /* Paper: Mode 2 - Fixed Full A4 Page Mode */
    .legal-paper.a4-fixed-mode {
      position: absolute !important;
      top: 0 !important;
      left: 50% !important;
      transform-origin: top center !important;
      width: 794px !important;
      height: 1123px !important;
      max-height: 1123px !important;
      min-height: 1123px !important;
      padding: 22mm 22mm 20mm 22mm !important;
      border-radius: 2px !important;
      overflow: hidden !important;
    }

    /* ================= Official Iraqi Judicial Double Border ================= */
    /* Hidden during responsive typing to keep screen clean, visible in A4 mode and Print */
    .doc-luxury-border {
      display: none;
      position: absolute;
      top: 6.5mm;
      bottom: 6.5mm;
      left: 6.5mm;
      right: 6.5mm;
      border: 1.4px solid #0f172a;
      pointer-events: none;
      z-index: 10;
      box-sizing: border-box;
    }

    .legal-paper.a4-fixed-mode .doc-luxury-border {
      display: block !important;
    }

    .doc-luxury-border-inner {
      position: absolute;
      top: 2.2mm;
      bottom: 2.2mm;
      left: 2.2mm;
      right: 2.2mm;
      border: 0.6px solid #475569;
      box-sizing: border-box;
    }

    .border-corner {
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: #0f172a;
      border-style: solid;
      border-width: 0;
    }

    .border-corner-tl { top: -4px; left: -4px; border-top-width: 2.5px; border-left-width: 2.5px; }
    .border-corner-tr { top: -4px; right: -4px; border-top-width: 2.5px; border-right-width: 2.5px; }
    .border-corner-bl { bottom: -4px; left: -4px; border-bottom-width: 2.5px; border-left-width: 2.5px; }
    .border-corner-br { bottom: -4px; right: -4px; border-bottom-width: 2.5px; border-right-width: 2.5px; }

    /* ================= Editable Document Surface ================= */
    .document-body {
      position: relative;
      z-index: 5;
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.65;
      color: #0f172a;
      direction: rtl;
      text-align: justify;
      outline: none;
      min-height: 800px;
    }

    .document-body h3 {
      font-family: var(--font-heading);
      font-size: 17.5px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 16px;
      color: #0f172a;
    }

    .document-body p {
      margin-bottom: 0.48em;
      line-height: 1.65;
      text-align: justify;
    }

    .document-body strong, .document-body b {
      font-weight: 700;
      color: inherit;
    }

    .document-body u {
      text-underline-offset: 3px;
    }

    /* Red Legal Highlight Rule */
    .legal-red, 
    span[style*="color:#dc2626"], 
    span[style*="color: #dc2626"], 
    span[style*="rgb(220, 38, 38)"],
    font[color="#dc2626"],
    font[color="red"] {
      color: #dc2626 !important;
      font-weight: 700 !important;
    }

    span[style*="color:#dc2626"] *, 
    span[style*="color: #dc2626"] *, 
    .legal-red * {
      color: #dc2626 !important;
    }

    /* Signature table */
    .document-body table {
      width: 100% !important;
      border-collapse: collapse !important;
      margin-top: 18px !important;
      border: none !important;
    }

    .document-body table td {
      border: none !important;
      padding: 4px 6px !important;
      vertical-align: top;
      font-size: 14.5px;
    }

    /* ================= Mobile Fixed Bottom Bar ================= */
    .mobile-bottom-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0f172a;
      border-top: 1px solid rgba(212, 175, 55, 0.25);
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      z-index: 50;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      justify-content: space-around;
      align-items: center;
    }

    .m-nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.15s ease;
    }

    .m-nav-btn.active {
      color: var(--gold-primary);
      background: rgba(212, 175, 55, 0.12);
    }

    .m-nav-btn svg {
      width: 20px;
      height: 20px;
    }

    /* Toast */
    .toast-msg {
      position: fixed;
      bottom: 74px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid var(--gold-primary);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      z-index: 120;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      pointer-events: none;
      text-align: center;
      max-width: 90%;
    }

    .toast-msg.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    /* Mobile Responsive */
    @media (max-width: 1023px) {
      .mobile-bottom-bar {
        display: flex;
      }

      .header-actions {
        display: none;
      }

      .studio-wrapper {
        padding: 6px 4px 85px;
      }

      .legal-paper:not(.a4-fixed-mode) {
        padding: 20px 16px;
        border-radius: 8px;
      }

      .document-body {
        font-size: 15px;
      }

      .tools-group .btn-save-tool,
      .tools-group .btn-print-tool {
        display: none;
      }
    }

    /* ================= Pure Apple & Browser Single-Page Vector Print Rules ================= */
    @media print {
      @page {
        size: 210mm 297mm;
        margin: 0 !important;
      }

      *, *::before, *::after {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      html, body {
        margin: 0 !important;
        padding: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
        max-height: 297mm !important;
        background: #ffffff !important;
        color: #0f172a !important;
        overflow: hidden !important;
      }

      .no-print, 
      .app-header, 
      .mobile-bottom-bar, 
      .studio-toolbar, 
      .cases-bar,
      .toast-msg {
        display: none !important;
      }

      .studio-wrapper, 
      .studio-card, 
      .paper-stage, 
      .paper-scaler {
        margin: 0 !important;
        padding: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
        max-height: 297mm !important;
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        transform: none !important;
        position: static !important;
        overflow: visible !important;
      }

      .legal-paper {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
        max-height: 297mm !important;
        min-height: 297mm !important;
        transform: none !important;
        margin: 0 !important;
        padding: 16mm 20mm 16mm 18mm !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        box-sizing: border-box !important;
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
        overflow: hidden !important;
        background: #ffffff !important;
      }

      .doc-luxury-border {
        display: block !important;
        position: absolute !important;
        top: 6.5mm !important;
        bottom: 6.5mm !important;
        left: 6.5mm !important;
        right: 6.5mm !important;
        border: 1.4px solid #0f172a !important;
        z-index: 10 !important;
      }

      .doc-luxury-border-inner {
        display: block !important;
        position: absolute !important;
        top: 2.2mm !important;
        bottom: 2.2mm !important;
        left: 2.2mm !important;
        right: 2.2mm !important;
        border: 0.6px solid #475569 !important;
      }

      .border-corner {
        display: block !important;
        border-color: #0f172a !important;
      }

      .document-body {
        font-size: 13.5px !important;
        line-height: 1.56 !important;
        min-height: auto !important;
      }

      .document-body h3 {
        font-size: 15.5px !important;
        margin-bottom: 10px !important;
      }

      .document-body p {
        margin-bottom: 0.42em !important;
      }
    }
  </style>
</head>
<body>

  <!-- ================= App Header ================= -->
  <header class="app-header no-print">
    <div class="header-content">
      <div class="brand-group">
        <img src="icon-192.png" alt="شعار الميزان" class="brand-logo">
        <div class="brand-text">
          <h1>العرائض القضائية <span class="badge-pill">عراقية أصولية</span></h1>
          <p>المحامي سعد فراس أميل (الصلاحية أ - 188572)</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-gold" onclick="savePetition()">
          <span>💾 حفظ وتأمين</span>
        </button>
        <button class="btn btn-dark" onclick="window.print()">
          <span>🖨️ طباعة A4 / حفظ PDF</span>
        </button>
        <a href="petition.pdf" target="_blank" class="btn btn-dark" style="color:#38bdf8;" title="تحميل عريضة عمر رعد الرسمية الفاخرة">
          <span>📑 PDF عريضة عمر رعد</span>
        </a>
      </div>
    </div>
  </header>

  <!-- ================= Studio Workspace ================= -->
  <main class="studio-wrapper">
    
    <!-- Quick Case Templates Bar -->
    <div class="cases-bar no-print">
      <div class="case-pill active" id="chipOmar" onclick="loadOmarPetition()">
        <span>⚖️</span>
        <span>عريضة عمر رعد خليفه (تحقيق الدورة) ⭐</span>
      </div>
      <div class="case-pill" onclick="createNewPetition()">
        <span>➕</span>
        <span>عريضة جديدة فارغة</span>
      </div>
      <div class="case-pill" onclick="restoreSavedDraft()">
        <span>🔄</span>
        <span>استرجاع آخر مسودة محفوظة</span>
      </div>
    </div>

    <!-- Main Card -->
    <div class="studio-card">
      
      <!-- Formatting Toolbar -->
      <div class="studio-toolbar no-print">
        <div class="toolbar-row-main">
          
          <!-- Mode Switcher -->
          <div class="mode-switch-pill">
            <button type="button" class="mode-btn active" id="btnWriteMode" onclick="setViewMode('write')">
              <span>✍️ كتابة مريحة</span>
            </button>
            <button type="button" class="mode-btn" id="btnA4Mode" onclick="setViewMode('a4')">
              <span>📄 ورقة A4 كاملة</span>
            </button>
          </div>

          <!-- Highlight & Font Tools -->
          <div class="tools-group">
            <button type="button" class="tool-btn btn-red-tool" onclick="applyHighlightColor('#dc2626')" title="تلوين النص المحدد بالأحمر الملوكي لجذب النظر">
              🔴 أحمر
            </button>
            <button type="button" class="tool-btn" onclick="applyHighlightColor('#0f172a')" title="إعادة النص للأسود الرسمي">
              ⚫ أسود
            </button>
            <button type="button" class="tool-btn" onclick="execFormat('bold')" title="خط عريض">
              <b>B</b>
            </button>
            <button type="button" class="tool-btn" onclick="execFormat('underline')" title="تسطير">
              <u>U</u>
            </button>
            <button type="button" class="tool-btn" onclick="adjustFontSize(1)" title="تكبير الخط">
              ➕
            </button>
            <button type="button" class="tool-btn" onclick="adjustFontSize(-1)" title="تصغير الخط">
              ➖
            </button>
            <button type="button" class="tool-btn" onclick="execFormat('undo')" title="تراجع">
              ↶
            </button>
            <button type="button" class="tool-btn" onclick="execFormat('redo')" title="إعادة">
              ↷
            </button>
          </div>

          <!-- Actions -->
          <div class="tools-group">
            <button type="button" class="tool-btn btn-save-tool" onclick="savePetition()">
              💾 حفظ
            </button>
            <button type="button" class="tool-btn btn-print-tool" onclick="window.print()">
              🖨️ طباعة / PDF
            </button>
            <a href="petition.pdf" target="_blank" class="tool-btn" style="color:#38bdf8; text-decoration:none;" title="تحميل عريضة عمر رعد الرسمية المباشرة">
              📑 PDF آبل
            </a>
          </div>

        </div>
      </div>

      <!-- Paper Canvas Stage -->
      <div class="paper-stage" id="paperStage">
        <div class="paper-scaler" id="paperScaler">
          <div class="legal-paper" id="legalPaper">
            
            <!-- Prestigious Iraqi Judicial Double Frame (برواز رسمي فخم وخفيف) -->
            <div class="doc-luxury-border no-copy" aria-hidden="true">
              <div class="doc-luxury-border-inner">
                <div class="border-corner border-corner-tl"></div>
                <div class="border-corner border-corner-tr"></div>
                <div class="border-corner border-corner-bl"></div>

  <!-- App Script -->
  <script>
    const STORAGE_KEY = 'saadamil_saved_petition_html';

    const OMAR_PETITION_DEFAULT_HTML = `
<h3 style="text-align: center; margin-bottom: 22px; font-size: 18px; font-weight: 800;">/ إلى السيد قاضي محكمة تحقيق الدورة المحترم</h3>

<p style="margin-bottom: 8px;"><strong>المشتكي:</strong> عمر رعد خليفه &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <strong>الساكن:</strong> بغداد - الدورة، محلة (842)، زقاق (9)، دار (6)</p>
<p style="margin-bottom: 14px;"><strong>المشكو منهما:</strong><br>
1. <strong>شهد عباس لفته</strong> (الزوجة)<br>
2. <strong>ناهد</strong> (والدة الزوجة - شريكة بالتحريض والاتفاق)<br>
&nbsp;&nbsp;&nbsp;&nbsp;<strong>الساكنتان:</strong> بغداد - الدورة، الإسكان، قرب جامع الإسكان (بدلالة المشتكي)</p>

<p style="text-align: center; margin-top: 16px; margin-bottom: 16px; font-size: 16.5px;"><strong><u>م / طلب اتخاذ الإجراءات القانونية</u></strong></p>

<p style="margin-bottom: 12px;"><strong>تحية طيبة واحتراماً،</strong></p>

<p style="line-height: 1.6; margin-bottom: 10px; text-align: justify;">سبق وأن أقدمت المشكو منها الأولى باتفاق وتحريض ومساعدة من والدتها المشكو منها الثانية، على ارتكاب الأفعال الجرمية الآتية بحق موكلي:</p>

<p style="line-height: 1.6; margin-bottom: 8px; text-align: justify;"><strong>1.</strong> قيام المشكو منها الأولى بتهديد موكلي هاتفياً وعبر الرسائل النصية بالقتل والذبح والتوعد بالاستعانة بأقاربها وأعمامها لإيذائه والنيل من سلامته الجسدية.</p>

<p style="line-height: 1.6; margin-bottom: 8px; text-align: justify;"><strong>2.</strong> قيام المشكو منها الأولى بالحضور لمرتين متتاليتين أمام دار سكن موكلي الكائن في (الدورة - محلة 842) والصراخ في الشارع والتسبب بتجمهر أهالي المنطقة وتوجيه عبارات السب والقذف والشتم العلني بحق موكلي ووالدته وأسرته بقصد الحط من كرامتهم وتخريب سمعتهم أمام الجيران، والمثبت بشهادة الشهود الحاضرين.</p>

<p style="line-height: 1.6; margin-bottom: 8px; text-align: justify;"><strong>3.</strong> قيام المشكو منها بالتشهير بموكلي لدى صديقه المقرب (الشاهد) علي سلام (صبحي) والطعن بسلوكه وأخلاقه وادعاء أنه يشرب الكحول داخل الدار في حين أنها هي من طلبت ذلك وألحت عليه، فضلاً عن التلويح باختلاق تهمة كاذبة مخلة بالحياء والشرف تزعم فيها إدخال شخص للدار وهي عروسة بقصد ابتزازه والإساءة لسمعته، والمثبت بالمحادثات ومكالمة الوساطة المسجلة التي استغرقت ساعة و(34) دقيقة.</p>

<p style="line-height: 1.6; margin-bottom: 12px; text-align: justify;"><strong>4.</strong> قيام المشكو منهما بالاتصال بالشاهدة (عهود) عبد الرحمن خلاف - والدة صديق موكلي علي سلام (صبحي) ومحاولة التأثير عليها والضغط لحملها هي وابنها على الإدلاء بشهادة زور ضد موكلي واختلاق ادعاءات باطلة، والموثق بالبصمات الصوتية الصادرة من الشاهدة (عهود) التي توثق هذه المحاولات بدلالة جريمة التحريض على شهادة الزور.</p>

<p style="line-height: 1.6; margin-bottom: 12px; text-align: justify;">وحيث إن ما ارتكبته المشكو منهما يشكل جرائم معاقباً عليها بموجب أحكام <strong>المواد (430) و(432) و(434) و(248)</strong> وبدلالة <strong>المادتين (48 و49)</strong> من قانون العقوبات العراقي رقم 111 لسنة 1969 المعدل:</p>

<p style="line-height: 1.6; margin-bottom: 6px;"><strong>لذا؛ نطلب من عدالتكم الموقرة التفضل بـ:</strong></p>
<p style="line-height: 1.55; margin-bottom: 4px;"><strong>أولاً:</strong> تدوين أقوال موكلي كمشتكٍ ومطالب بالحق الجزائي والشخصي والتعويض المادي والمعنوي لرد اعتباره.</p>
<p style="line-height: 1.55; margin-bottom: 4px;"><strong>ثانياً:</strong> التفضل بإحالة الأوراق إلى <span class="legal-red" style="color: #dc2626; font-weight: bold;">السيد المحقق القضائي</span> في محكمتكم الموقرة لتدوين أقوال موكلي وتدوين شهادات شهود الإثبات الأربعة (علي سلام، صبحي مصطفى فائق، عباس عهود عبد الرحمن، خلاف هدى محمد عثمان) الحاضرين بدلالة المشتكي توفيراً للوقت وحفاظاً على سرية الإجراءات.</p>
<p style="line-height: 1.55; margin-bottom: 4px;"><strong>ثالثاً:</strong> ربط المبرزات الجرمية الفنية (البصمات الصوتية والمحادثات) المرفقة على وسيط تخزين بالأوراق التحقيقية وتكليف خبير الأدلة الفنية بتفريغها رسمياً.</p>
<p style="line-height: 1.55; margin-bottom: 4px;"><strong>رابعاً:</strong> إصدار أمر بضبط جهاز الهاتف المحمول الخاص بالمشكو منها الأولى وتفريغه فنياً كونه أداة ارتكاب الجريمة استناداً للمادة (154) من قانون أصول المحاكمات الجزائية.</p>
<p style="line-height: 1.55; margin-bottom: 12px;"><strong>خامساً:</strong> اتخاذ الإجراءات القانونية الأصولية وإصدار أمر استقدام بحق المشكو منهما وإلزامهما بتقديم تعهد عدلي مغلظ مصحوب بكفالة مالية ضامنة بعدم التعرض لموكلي أو عائلته أو الاقتراب من دار سكناه مطلقاً.</p>

<p style="text-align: center; margin-top: 18px; margin-bottom: 18px; font-size: 15.5px;"><strong>مع وافر الشكر والتقدير والاحترام</strong></p>

<table style="width: 100%; border: none; margin-top: 22px;">
  <tbody>
    <tr>
      <td style="width: 50%; border: none; text-align: right; vertical-align: bottom;">
        <strong>التاريخ:</strong> 8 / 11 / 2026 م
      </td>
      <td style="width: 50%; border: none; text-align: left; vertical-align: bottom;">
        <strong>وكيل المشتكي</strong><br>
        <strong>المحامي سعد فراس أميل</strong>
      </td>
    </tr>
  </tbody>
</table>
`;

    let currentMode = 'write';
    let baseFontSize = 15;

    document.addEventListener('DOMContentLoaded', () => {
      const editorEl = document.getElementById('docContent');
      
      // Load saved user draft if present, else default
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved && saved.trim().length > 50) {
        editorEl.innerHTML = saved;
        console.log('Restored saved user petition with 100% fidelity.');
      } else {
        editorEl.innerHTML = OMAR_PETITION_DEFAULT_HTML.trim();
      }

      // Default mode based on screen
      if (window.innerWidth < 1024) {
        setViewMode('write');
      } else {
        setViewMode('a4');
      }

      // Auto-save on every input
      editorEl.addEventListener('input', () => {
        localStorage.setItem(STORAGE_KEY, editorEl.innerHTML);
      });

      window.addEventListener('resize', () => {
        if (currentMode === 'a4') {
          scaleA4Sheet();
        }
      });
    });

    // View Mode Switcher
    function setViewMode(mode) {
      currentMode = mode;
      const paper = document.getElementById('legalPaper');
      const scaler = document.getElementById('paperScaler');
      const btnWrite = document.getElementById('btnWriteMode');
      const btnA4 = document.getElementById('btnA4Mode');
      const mBtnWrite = document.getElementById('mBtnWrite');
      const mBtnA4 = document.getElementById('mBtnA4');

      if (!paper) return;

      if (mode === 'write') {
        paper.classList.remove('a4-fixed-mode');
        paper.style.transform = 'none';
        paper.style.position = 'relative';
        paper.style.left = 'auto';
        paper.style.width = '100%';
        paper.style.height = 'auto';
        paper.style.minHeight = '850px';

        if (scaler) {
          scaler.style.width = '100%';
          scaler.style.height = 'auto';
        }

        if (btnWrite) btnWrite.classList.add('active');
        if (btnA4) btnA4.classList.remove('active');
        if (mBtnWrite) mBtnWrite.classList.add('active');
        if (mBtnA4) mBtnA4.classList.remove('active');

        showToast('✍️ وضع الكتابة المريح: تحرير سلس بعرض الشاشة دون انزلاق');
      } else {
        paper.classList.add('a4-fixed-mode');
        scaleA4Sheet();

        if (btnWrite) btnWrite.classList.remove('active');
        if (btnA4) btnA4.classList.add('active');
        if (mBtnWrite) mBtnWrite.classList.remove('active');
        if (mBtnA4) mBtnA4.classList.add('active');

        showToast('📄 وضع المعاينة A4: الورقة كاملة مع البرواز الرسمي');
      }
    }

    function scaleA4Sheet() {
      const paper = document.getElementById('legalPaper');
      const scaler = document.getElementById('paperScaler');
      const stage = document.getElementById('paperStage');
      if (!paper || !scaler) return;

      const availWidth = Math.max(280, (stage.clientWidth > 0 ? stage.clientWidth : window.innerWidth) - 16);
      const availHeight = Math.max(300, window.innerHeight - 150);

      const zoomW = availWidth / 794;
      const zoomH = availHeight / 1123;
      let targetZoom = Math.min(zoomW, zoomH);
      targetZoom = Math.max(0.32, Math.min(1.1, targetZoom));

      const scaledWidth = Math.round(794 * targetZoom);
      const scaledHeight = Math.round(1123 * targetZoom);

      scaler.style.width = scaledWidth + 'px';
      scaler.style.height = scaledHeight + 'px';

      paper.style.transform = 'translateX(-50%) scale(' + targetZoom + ')';
      paper.style.transformOrigin = 'top center';
    }

    // Highlighting & Formatting
    function applyHighlightColor(colorHex) {
      document.execCommand('styleWithCSS', false, true);
      document.execCommand('foreColor', false, colorHex);
      
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        if (!range.collapsed) {
          const span = document.createElement('span');
          span.style.color = colorHex;
          if (colorHex === '#dc2626') {
            span.className = 'legal-red';
            span.style.fontWeight = 'bold';
          }
          try {
            range.surroundContents(span);
          } catch (e) {}
        }
      }

      savePetition(true);
      if (colorHex === '#dc2626') {
        showToast('🔴 تم تلوين النص المحدد بالأحمر الملوكي');
      } else {
        showToast('⚫ تمت إعادة النص للون الأسود');
      }
    }

    function execFormat(cmd) {
      document.execCommand(cmd, false, null);
      savePetition(true);
    }

    function adjustFontSize(delta) {
      baseFontSize += delta;
      baseFontSize = Math.max(11, Math.min(24, baseFontSize));
      const editorEl = document.getElementById('docContent');
      if (editorEl) {
        editorEl.style.fontSize = baseFontSize + 'px';
      }
      showToast('حجم الخط: ' + baseFontSize + 'px');
    }

    // Save & Load
    function savePetition(silent = false) {
      const editorEl = document.getElementById('docContent');
      if (editorEl) {
        localStorage.setItem(STORAGE_KEY, editorEl.innerHTML);
        if (!silent) {
          showToast('💾 تم حفظ العريضة وتأمينها بنجاح في جهازك ✅');
        }
      }
    }

    function restoreSavedDraft() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved && saved.trim().length > 50) {
        document.getElementById('docContent').innerHTML = saved;
        showToast('🔄 تم استرجاع آخر مسودة محفوظة');
      } else {
        showToast('لا توجد مسودة محفوظة سابقة.');
      }
    }

    function loadOmarPetition() {
      if (confirm('هل ترغب في تحميل عريضة عمر رعد خليفه الأصلية؟')) {
        document.getElementById('docContent').innerHTML = OMAR_PETITION_DEFAULT_HTML.trim();
        savePetition(true);
        showToast('⚖️ تم تحميل عريضة عمر رعد خليفه (محكمة تحقيق الدورة)');
      }
    }

    function createNewPetition() {
      if (confirm('هل ترغب في بدء عريضة جديدة فارغة؟ تأكد من حفظ نسختك الحالية.')) {
        const blank = `
<h3 style="text-align: center; margin-bottom: 22px; font-size: 18px; font-weight: 800;">/ إلى السيد قاضي محكمة ... المحترم</h3>

<p style="margin-bottom: 8px;"><strong>المشتكي (أو المدعي):</strong> ... &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <strong>الساكن:</strong> بغداد - ...</p>
<p style="margin-bottom: 14px;"><strong>المشكو منه (أو المدعى عليه):</strong> ... &nbsp;&nbsp;&nbsp;&nbsp; <strong>الساكن:</strong> بغداد - ...</p>

<p style="text-align: center; margin-top: 16px; margin-bottom: 16px; font-size: 16.5px;"><strong><u>م / ...</u></strong></p>

<p style="margin-bottom: 12px;"><strong>تحية طيبة واحتراماً،</strong></p>

<p style="line-height: 1.6; margin-bottom: 10px; text-align: justify;">نحيط عدالتكم علماً بالآتي: ...</p>

<p style="text-align: center; margin-top: 18px; margin-bottom: 18px; font-size: 15.5px;"><strong>مع وافر الشكر والتقدير والاحترام</strong></p>

<table style="width: 100%; border: none; margin-top: 22px;">
  <tbody>
    <tr>
      <td style="width: 50%; border: none; text-align: right; vertical-align: bottom;">
        <strong>التاريخ:</strong> 8 / 11 / 2026 م
      </td>
      <td style="width: 50%; border: none; text-align: left; vertical-align: bottom;">
        <strong>وكيل المشتكي</strong><br>
        <strong>المحامي سعد فراس أميل</strong>
      </td>
    </tr>
  </tbody>
</table>
        `;
        document.getElementById('docContent').innerHTML = blank.trim();
        savePetition(true);
        showToast('📄 تم فتح عريضة جديدة فارغة');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toastBox');
      if (!toast) return;
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }
  </script>
