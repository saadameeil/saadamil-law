<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>استوديو العرائض والطباعة القضائية A4 — المحامي سعد فراس أميل</title>
  
  <!-- Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Noto+Naskh+Arabic:wght@400;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Modern Document Engines (Docx & FileSaver) -->
  <script src="https://unpkg.com/docx@9/dist/index.iife.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    :root {
      --gold-primary: #d4af37;
      --gold-hover: #b8860b;
      --bg-dark: #090e1a;
      --bg-card: #0f172a;
      --bg-input: #1e293b;
      --border-color: rgba(212, 175, 55, 0.3);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      direction: rtl;
      -webkit-font-smoothing: antialiased;
    }

    /* ================= Top Sticky App Header ================= */
    .app-header {
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 10px 16px;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      border: 1px solid var(--gold-primary);
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 15px;
      font-weight: 900;
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-text p {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .badge-pill {
      background: linear-gradient(135deg, #d4af37, #996515);
      color: #0b1120;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Header Actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 13px;
      font-size: 12.5px;
      font-weight: 800;
      font-family: inherit;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
      border: 1px solid transparent;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-gold {
      background: linear-gradient(135deg, #d4af37, #b8860b);
      color: #0b1120;
      border-color: #fcd34d;
    }

    .btn-green {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border-color: #34d399;
    }

    .btn-blue {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border-color: #60a5fa;
    }

    .btn-dark {
      background: #1e293b;
      color: #f1f5f9;
      border-color: #334155;
    }

    .btn-refresh {
      background: rgba(212, 175, 55, 0.15);
      border-color: rgba(212, 175, 55, 0.4);
      color: #fde68a;
    }

    /* ================= View Modes Bar (Tabs) ================= */
    .tabs-bar {
      background: #0b1329;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tab-group {
      display: flex;
      gap: 6px;
    }

    .tab-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(212, 175, 55, 0.1));
      border-color: var(--gold-primary);
      color: #fde68a;
    }

    .page-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    /* ================= Workspace Layout ================= */
    .studio-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Editor Toolbar */
    .editor-toolbar {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 11px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
    }

    .tool-btn:hover {
      background: #334155;
    }

    .tool-red {
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.1);
    }

    .tool-gold {
      color: #fde68a;
      border-color: rgba(212, 175, 55, 0.4);
      background: rgba(212, 175, 55, 0.1);
    }

    /* ================= A4 Physical Sheet Viewport ================= */
    .stage-wrapper {
      background: #050811;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 30px 10px;
      overflow-x: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      min-height: 80vh;
    }

    /* The Real A4 Sheet (210mm x 297mm) */
    .a4-physical-sheet {
      width: 210mm;
      min-height: 297mm;
      height: 297mm;
      background: #ffffff;
      color: #0f172a;
      padding: 12mm 15mm 12mm 15mm;
      box-sizing: border-box;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(0, 0, 0, 0.15);
      border-radius: 2px;
      direction: rtl;
      text-align: justify;
      position: relative;
      overflow: hidden;
      font-family: 'Cairo', 'Noto Naskh Arabic', sans-serif;
      font-size: 13.5px;
      line-height: 1.52;
      transition: all 0.2s ease;
    }

    .a4-sheet-editable {
      outline: none;
      min-height: 100%;
    }

    /* Typography & Document Styles */
    .court-header {
      text-align: right;
      font-size: 17.5px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 8px;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 4px;
    }

    .parties-block {
      margin-bottom: 6px;
      font-size: 13.5px;
      line-height: 1.52;
    }

    .parties-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .subject-box {
      text-align: center;
      margin: 8px 0;
      font-size: 15.5px;
      font-weight: 900;
    }

    .subject-box u {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .salutation {
      font-size: 13.5px;
      font-weight: 800;
      margin-bottom: 3px;
    }

    .intro-text {
      font-size: 13.5px;
      line-height: 1.52;
      margin-bottom: 6px;
      text-align: justify;
    }

    .crime-item {
      font-size: 13.1px;
      line-height: 1.48;
      margin-bottom: 6px;
      text-align: justify;
    }

    .crime-title {
      font-weight: 800;
      color: #0f172a;
    }

    .legal-red {
      color: #dc2626 !important;
      font-weight: 800 !important;
    }

    .witness-box {
      margin: 6px 0;
      font-size: 13.2px;
      line-height: 1.50;
      border: none !important;
      padding: 2px 0;
    }

    .witness-header {
      font-weight: 800;
      margin-bottom: 3px;
    }

    .witness-grid {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .requests-header {
      font-size: 13.5px;
      font-weight: 800;
      margin-top: 6px;
      margin-bottom: 3px;
    }

    .req-item {
      font-size: 13.0px;
      line-height: 1.47;
      margin-bottom: 2px;
      text-align: justify;
    }

    .closing-text {
      text-align: center;
      font-size: 14.5px;
      font-weight: 800;
      margin: 9px 0 6px 0;
    }

    .footer-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
      border: none !important;
    }

    .footer-table td {
      border: none !important;
      padding: 0;
      vertical-align: bottom;
    }

    /* ================= Mobile Floating Action Bar ================= */
    .mobile-float-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border-color);
      padding: 8px 6px;
      z-index: 150;
      justify-content: space-around;
      align-items: center;
    }

    .m-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    .m-btn.highlight {
      color: #fde68a;
    }
    .m-btn.green {
      color: #34d399;
    }

    /* Toast Notification */
    .toast-msg {
      position: fixed;
      bottom: 75px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid var(--gold-primary);
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 9999;
      text-align: center;
      white-space: nowrap;
    }
    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ================= Responsive Layout for Mobile ================= */
    @media (max-width: 860px) {
      .mobile-float-bar {
        display: flex;
      }
      .studio-container {
        padding: 8px 6px 75px;
      }
      .stage-wrapper {
        padding: 14px 4px 60px;
        border-radius: 8px;
      }
      .a4-physical-sheet {
        transform-origin: top center;
        margin: 0 auto;
      }
      .header-actions {
        display: none;
      }
    }

    /* ================= 100% Strict Pure W3C Print Rules ================= */
    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm 12mm 10mm 12mm;
      }

      *, *::before, *::after {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        box-shadow: none !important;
      }

      html, body {
        background: #ffffff !important;
        color: #0f172a !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: auto !important;
        overflow: visible !important;
      }

      .app-header,
      .tabs-bar,
      .editor-toolbar,
      .mobile-float-bar,
      .toast-msg,
      .no-print {
        display: none !important;
      }

      .studio-container {
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
      }

      .stage-wrapper {
        background: #ffffff !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      .a4-physical-sheet {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        min-height: auto !important;
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
        transform: none !important;
        page-break-inside: avoid !important;
      }
    }
  </style>
</head>
<body>

  <!-- ================= App Header ================= -->
  <header class="app-header no-print">
    <div class="header-content">
      <div class="brand-group">
        <img src="icon-192.png" alt="المحامي سعد فراس أميل" class="brand-logo">

          <h1>استوديو العرائض القضائية الذكي <span class="badge-pill">محاكم بغداد</span></h1>

        </div>
      </div>

      <!-- Desktop Essential Action Buttons -->
      <div class="header-actions">

        </button>
        <button type="button" class="btn btn-green" onclick="shareLivePetitionToWhatsApp()" title="إرسال ملف الـ PDF الأصلي لواتساب كشك الاستنساخ">

        </button>
        <button type="button" class="btn btn-dark" onclick="triggerCleanPrint()" title="طباعة الورقة فوراً">

        <button type="button" class="btn btn-refresh" onclick="forceAppRefresh()" title="تحديث وسحب أحدث نسخة">

      </div>
    </div>
  </header>

  <!-- ================= View Modes Bar ================= -->
  <div class="tabs-bar no-print">
    <div class="tab-group">
      <button class="tab-btn active" id="tabSheetBtn" onclick="switchViewMode('sheet')">
        📄 الورقة الرسمية المطبوعة (A4)
      </button>
      <button class="tab-btn" id="tabEditorBtn" onclick="switchViewMode('editor')">
        ✍️ تعديل المحتوى والنصوص

    </div>

    <div style="display: flex; align-items: center; gap: 8px;">

      </span>
      <button class="tool-btn" onclick="adjustDocFontSize(0.5)" title="تكبير الخط">
        ➕ تكبير
      </button>
      <button class="tool-btn" onclick="adjustDocFontSize(-0.5)" title="تصغير الخط">
        ➖ تصغير
      </button>
    </div>
  </div>

  <!-- ================= Workspace Layout ================= -->
  <main class="studio-container">

    <!-- Secondary Formatting Toolbar (Visible in Edit Mode) -->
    <div class="editor-toolbar no-print" id="editorToolbar" style="display: none;">
      <button class="tool-btn tool-red" onclick="applyHighlightColor('#dc2626')">
        🔴 تلوين أحمر
      </button>
      <button class="tool-btn" onclick="applyHighlightColor('#0f172a')">
        ⚫ إعادة للأسود
      </button>
      <button class="tool-btn" onclick="execFormat('bold')">
        <b>B عريض</b>
      </button>
      <button class="tool-btn" onclick="execFormat('underline')">
        <u>U تسطير</u>
      </button>
      <button class="tool-btn tool-gold" onclick="cycleFontFamily()">
        🖋️ <span id="fontFamilyLabel">الخط: Cairo</span>
      </button>
      <button class="tool-btn" onclick="loadAuditedOmarPetition()" title="استعادة النسخة القضائية المدققة (الموصى بها)">
        ⚖️ النسخة المدققة قانونياً
      </button>
      <button class="tool-btn" onclick="loadOriginalDraftOmarPetition()" title="استعادة النسخة الأصلية الأولى">
        📋 النسخة الأولى
      </button>
    </div>

    <!-- The Stage: Holding Physical A4 Sheet -->
    <div class="stage-wrapper" id="stageWrapper">
      
      <!-- Page 1 (Physical A4 Sheet) -->
      <div class="a4-physical-sheet" id="a4SheetPage1">
        <div class="a4-sheet-editable" id="docContent" contenteditable="true" spellcheck="false">
          <!-- Live Verified Content Injected Here -->
        </div>
      </div>

    </div>

  </main>

  <!-- ================= Mobile Floating Action Bar ================= -->
  <nav class="mobile-float-bar no-print">
    <button class="m-btn green" onclick="downloadPristinePdf()">
      <span style="font-size:18px;">📥</span>
      <span>تنزيل PDF</span>
    </button>
    <button class="m-btn green" onclick="shareLivePetitionToWhatsApp()">
      <span style="font-size:18px;">🟢</span>
      <span>واتساب الكشك</span>
    </button>
    <button class="m-btn highlight" onclick="triggerCleanPrint()">
      <span style="font-size:18px;">🖨️</span>
      <span>طباعة الآن</span>
    </button>
    <button class="m-btn" onclick="downloadLiveWordDoc()">
      <span style="font-size:18px;">📄</span>
      <span>ملف Word</span>
    </button>
    <button class="m-btn" onclick="forceAppRefresh()">
      <span style="font-size:18px;">🔄</span>
      <span>تحديث</span>
    </button>
  </nav>

  <!-- Toast Notification -->
  <div class="toast-msg" id="toastMsg"></div>

  <div class="intro-text">

    // Initialize Document on Startup
    window.addEventListener('DOMContentLoaded', () => {
      const editorEl = document.getElementById('docContent');
      if (!editorEl) return;

      const saved = localStorage.getItem(ACTIVE_DRAFT_KEY);
      editorEl.innerHTML = saved && saved.trim().length > 100 ? saved : MASTER_AUDITED_HTML;

      editorEl.addEventListener('input', () => {
        saveDocumentLive();
        checkPageBudget();
      });

      adjustMobileScale();
      window.addEventListener('resize', adjustMobileScale);

      checkPageBudget();
    });

    // Save Document Live
    function saveDocumentLive() {
      const editorEl = document.getElementById('docContent');
      if (editorEl) {
        localStorage.setItem(ACTIVE_DRAFT_KEY, editorEl.innerHTML);
      }
    }

    // Load Audited Master Version
    function loadAuditedOmarPetition() {
      const editorEl = document.getElementById('docContent');
      if (editorEl) {
        editorEl.innerHTML = MASTER_AUDITED_HTML;
        saveDocumentLive();
        checkPageBudget();
        showToast('⚖️ تم اعتماد النسخة القضائية المدققة (الموصى بها)!');
      }
    }

    // Load Original Draft Version
    function loadOriginalDraftOmarPetition() {
      const editorEl = document.getElementById('docContent');
      if (editorEl) {
        editorEl.innerHTML = ORIGINAL_DRAFT_HTML;
        saveDocumentLive();
        checkPageBudget();
        showToast('📋 تم اعتماد نسخة المسودة الأولى!');
      }
    }

    // Auto-scale A4 sheet on mobile so whole paper is visible without scrolling horizontally
    function adjustMobileScale() {
      const sheet = document.getElementById('a4SheetPage1');
      if (!sheet) return;
      const screenW = window.innerWidth;
      if (screenW <= 860) {
        const targetW = 794; // 210mm in px at 96dpi
        const availW = Math.min(screenW - 20, 794);
        const scale = availW / targetW;
        sheet.style.transform = `scale(${scale})`;
        sheet.style.transformOrigin = 'top center';
        sheet.style.marginBottom = `-${(1123 * (1 - scale))}px`;
      } else {
        sheet.style.transform = 'none';
        sheet.style.marginBottom = '0';
      }
    }

    // Check Page Height & Budget
    function checkPageBudget() {
      const sheet = document.getElementById('a4SheetPage1');
      const badge = document.getElementById('pageStatusBadge');
      if (!sheet || !badge) return;

      const contentH = sheet.scrollHeight;
      if (contentH <= 1130) {
        badge.innerHTML = '✅ صفحة A4 واحدة كاملة ومثالية';
        badge.style.background = 'rgba(16, 185, 129, 0.15)';
        badge.style.color = '#34d399';
        badge.style.borderColor = 'rgba(16, 185, 129, 0.4)';
      } else {
        badge.innerHTML = '📄 تجاوزت صفحة واحدة (يرجى الضغط على تصغير)';
        badge.style.background = 'rgba(239, 68, 68, 0.15)';
        badge.style.color = '#f87171';
        badge.style.borderColor = 'rgba(239, 68, 68, 0.4)';
      }
    }

    // Font Size Scaler across all elements
    function adjustDocFontSize(step) {
      const editorEl = document.getElementById('docContent');
      if (!editorEl) return;

      const elements = editorEl.querySelectorAll('p, div, span, td, strong, em, u');
      elements.forEach(el => {
        const curr = parseFloat(el.style.fontSize || window.getComputedStyle(el).fontSize) || 13.5;
        const next = Math.max(9, Math.min(26, Math.round((curr + step) * 10) / 10));
        el.style.fontSize = next + 'px';
      });

      baseFontSize = Math.max(9, Math.min(26, Math.round((baseFontSize + step) * 10) / 10));
      editorEl.style.fontSize = baseFontSize + 'px';

      saveDocumentLive();
      checkPageBudget();
      showToast((step > 0 ? '➕ تكبير الخط: ' : '➖ تصغير الخط: ') + baseFontSize + 'px');
    }

    function applyHighlightColor(color) {

      showToast(color === '#dc2626' ? '🔴 تم تلوين النص المحدد بالأحمر' : '⚫ إعادة النص للأسود');
    }

    function execFormat(cmd) {
      document.execCommand(cmd, false, null);
      saveDocumentLive();
    }

    // Cycle Arabic Font
    function cycleFontFamily() {
      currentFontIdx = (currentFontIdx + 1) % FONTS.length;

    // ================= Native PDF Vector Download (Zero-Cache Guaranteed) =================
    async function downloadPristinePdf() {
      showToast('📥 جاري تنزيل عريضة A4 المعتمدة الأصلية...');
      try {
        const response = await fetch('petition_omar.pdf?v=' + Date.now());
        if (!response.ok) throw new Error('File fetch error');
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'عريضة_عمر_الجبوري.pdf';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          window.URL.revokeObjectURL(url);
          document.body.removeChild(a);
        }, 1200);
        showToast('✅ تم تنزيل عريضة A4 الأصلية المعتمدة بنجاح!');
      } catch (e) {
        window.open('petition_omar.pdf?v=' + Date.now(), '_blank');
      }
    }

          a.click();
          showToast('✅ تم تنزيل العريضة PDF! افتح الواتساب لإرسالها مباشرة للكشك');
          const waUrl = 'https://api.whatsapp.com/send?text=' + encodeURIComponent('عريضة شكوى جزائية A4 - وكيل المشتكي المحامي سعد فراس أميل');
          setTimeout(() => window.open(waUrl, '_blank'), 1200);
          return;
        }
      } catch (err) {
        console.warn('Web Share failed:', err);
      }
      await downloadPristinePdf();
    }

    // ================= Client-Side True Binary Word (.docx) Generation =================
    async function downloadLiveWordDoc() {
      showToast('⏳ جاري إنشاء مستند Word (.docx) الأصلي بمقاسات A4...');
      try {
        if (typeof docx === 'undefined') {
          throw new Error('Docx engine not loaded');
        }

        const editorEl = document.getElementById('docContent');
        const textContent = editorEl ? editorEl.innerText : '';
        const lines = textContent.split('\n').filter(l => l.trim().length > 0);

        const { Document, Packer, Paragraph, TextRun, AlignmentType } = docx;

        const docParagraphs = lines.map(line => {
          const isHeader = line.includes('إلى /') || line.includes('محكمة تحقيق');
          const isSubject = line.includes('م /');
          const isRed = line.includes('جريمة القذف') || line.includes('جريمة التحريض') || line.includes('جريمة محاولة حمل') || line.includes('ثانياً:') || line.includes('ثالثاً:') || line.includes('رابعاً:');

          return new Paragraph({
            alignment: isSubject ? AlignmentType.CENTER : AlignmentType.RIGHT,
            bidirectional: true,
            spacing: { after: 120, line: 360 }, // 1.5 line spacing
            children: [
              new TextRun({
                text: line,
                bold: isHeader || isSubject || line.startsWith('1.') || line.startsWith('2.') || line.startsWith('3.') || line.startsWith('4.') || line.startsWith('5.') || line.startsWith('أولاً:') || line.startsWith('ثانياً:') || line.startsWith('ثالثاً:') || line.startsWith('رابعاً:'),
                size: isHeader ? 30 : (isSubject ? 28 : 24), // 15pt, 14pt, 12pt
                font: 'Cairo',
                color: isRed ? 'DC2626' : '0F172A'
              })
            ]
          });
        });

        const doc = new Document({
          sections: [{
            properties: {
              page: {
                size: { width: 11906, height: 16838 }, // Exact A4 in twips
                margin: { top: 850, bottom: 850, left: 1000, right: 1000 }
              }
            },
            children: docParagraphs
          }]
        });

        const blob = await Packer.toBlob(doc);
        saveAs(blob, 'عريضة_عمر_الجبوري.docx');
        showToast('✅ تم تنزيل مستند Word (.docx) الأصلي بنجاح!');
      } catch (err) {
        console.error('Docx generation error:', err);
        showToast('⚠️ جاري التنزيل المباشر...');
        downloadPristinePdf();
      }
    }

    // ================= Native Clean Print =================
    function triggerCleanPrint() {
      const sheet = document.getElementById('a4SheetPage1');
      if (sheet) {
        sheet.style.transform = 'none';
        sheet.style.marginBottom = '0';
      }
      setTimeout(() => {
        window.print();
        setTimeout(adjustMobileScale, 800);
      }, 200);
    }

    // Force App Refresh
    function forceAppRefresh() {
      localStorage.removeItem(ACTIVE_DRAFT_KEY);
      window.location.reload(true);
    }

    // Toast helper
    function showToast(msg) {
      const toast = document.getElementById('toastMsg');
      if (!toast) return;
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    }
  </script>
